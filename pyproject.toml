[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dh-compass"
version = "0.1.0"
description = "Heat grid optimization and planning tool for NRW"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "DATA_LICENSES.md"]
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14",
    "holidays>=0.30",
    "matplotlib>=3.7",
    "mip[highs]>=2.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "numpy-financial>=1.0",
    "openpyxl>=3.1",
    "osmnx>=1.8",
    "pandas>=2.0",
    "pyogrio>=0.7",
    "pyproj>=3.6",
    "requests>=2.28",
    "scikit-learn>=1.2",
    "shapely>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/ude-ewl/DH-COMPASS"
Issues = "https://github.com/ude-ewl/DH-COMPASS/issues"

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
"dh-compass" = "dh_compass.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pytest>=8.0",
    "ruff>=0.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

# A release may either copy the Vite build into this package's ``static``
# directory or deploy ``frontend/dist`` separately and configure its path.
[tool.setuptools.package-data]
"dh_compass.web" = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["outputs", "cache", "data", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

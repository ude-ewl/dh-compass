name: Validate source release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra web
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run python scripts/release_audit.py
      - run: uv run python scripts/export_source.py
      - run: uv run python scripts/release_audit.py --archive outputs/release/DH-COMPASS-source.zip
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run licenses:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
